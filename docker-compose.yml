services:
  workbench:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_PORT: "8080"
      CONFIG_PATH: /app/config/app.yaml
      DATA_DIR: /app/data
      SCRIPTS_DIR: /app/scripts
      FRONTEND_DIST: /app/frontend/dist
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./scripts:/app/scripts
